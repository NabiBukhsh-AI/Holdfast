# SC-GUARD development service configuration.
extends: ../base.yaml
mode: production
catalog:
  allow_other_category: true    # FR-042
registry:
  mode: production
  budget_tokens: 200
  tau_dup: 0.88                 # dev value only; sweep and report the ROC before staging
  conflict_detection: true
  tombstoning: true
assembly:
  mode: delimited               # FR-083
probe:
  option_order: randomized
extractor:
  guided_json: true
  backend: stub
service:
  host: 127.0.0.1
  port: 8080
  drain_timeout_ms: 200         # A-11
  queue_max_depth: 10000
  rate_limit_per_session_rps: 100
  rate_limit_per_tenant_rps: 10000
  max_content_bytes: 65536
  session_ttl_days: 30
  shadow_mode: false            # FR-086
database:
  dsn_env: HOLDFAST_PG_DSN
  backend: memory               # memory | postgres
redis:
  dsn_env: HOLDFAST_REDIS_DSN
  backend: memory               # memory | redis
online_eval:
  sample_rate: 0.01             # PR-011
