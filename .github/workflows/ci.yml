name: CI

# Spec 23.9: CI runs on every commit in under 10 minutes with no GPU and no paid API calls.
# Every model is stubbed. The metrics run for real, because they are pure functions and are
# the highest value target in the suite.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Tests and structural rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,service]"

      - name: Arithmetic gate
        # Runs first and alone. The Effect Retention fixtures validate the metric
        # implementation against the source arithmetic, and spec 32.4 makes a failure here an
        # escalation rather than a bug to grind through. Cheapest correctness gate available.
        run: pytest tests/unit/test_metrics.py -q

      - name: Golden fixtures
        # 60 framing strings and the prompt hashes, byte exact. Changing either requires a
        # deliberate regeneration and reviewer sign off.
        run: pytest tests/unit/test_catalog_and_framing.py tests/unit/test_prompts_and_config.py -q

      - name: Structural rules
        # Import isolation, the single assemble(), no prompts outside prompts/, no bare
        # except, no module level seeding, no em dashes.
        run: pytest tests/unit/test_repository_rules.py -q

      - name: Full suite
        run: pytest -q --junitxml=junit.xml

      - name: Coverage on the load bearing modules
        # Spec 32.3: above 90 percent on metrics, core, shared, and registry.
        run: |
          pytest -q \
            --cov=compint.core --cov=compint.eval.metrics \
            --cov=shared --cov=scguard.registry \
            --cov-report=term-missing --cov-fail-under=90

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,service]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: mypy --strict
        run: mypy

  fetch-gate:
    name: Prompt fetch gate status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Report the gate
        # Informational, never fails the build. The gate being closed is the CURRENT and
        # correct state of this repository: the compaction and extraction prompts are cited by
        # the source research but not reprinted, so they must be fetched, never reconstructed.
        # This step makes that visible on every run rather than buried in a document.
        run: python scripts/fetch_prompts.py --status || true
